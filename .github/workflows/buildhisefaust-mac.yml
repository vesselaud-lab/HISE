name: Mac Intel Build with Faust
on: [push, workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-13
    steps:
      - name: 1. Grab HISE
        uses: actions/checkout@v4

      - name: 2. Download and Setup Faust
        run: |
          # This downloads the Faust tools for Mac
          curl -L https://github.com/grame-cncm/faust/releases/download/2.75.7/Faust-2.75.7-x64.dmg -o faust.dmg
          # (Usually you'd install this, but we just need the headers for now)
          unzip tools/SDK/sdk.zip -d tools/SDK
          chmod +x tools/Projucer/Projucer.app/Contents/MacOS/Projucer

      - name: 3. Prepare Project for Faust
        run: |
          ./tools/Projucer/Projucer.app/Contents/MacOS/Projucer --resave "projects/standalone/HISE Standalone.jucer"

      - name: 4. Build HISE with Faust Mode
        run: |
          cd projects/standalone/Builds/MacOSX
          # We added "-scheme 'HISE Standalone - Release with Faust'" here!
          xcodebuild -project "HISE Standalone.xcodeproj" -scheme "HISE Standalone - Release with Faust" -configuration Release -arch x86_64

      - name: 5. Save the finished app
        uses: actions/upload-artifact@v4
        with:
          name: HISE-Mac-Intel-Faust
          path: projects/standalone/Builds/MacOSX/build/Release/HISE.app
